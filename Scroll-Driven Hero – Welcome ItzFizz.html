<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome ItzFizz – Scroll Hero</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  :root { --bg:#f3f0e8; --fg:#15171c; --muted:#6b6f7a; --accent:#e4572e; --road:#d9d4c7;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0c0d10; --fg:#f2f2f0; --muted:#8b8f9a; --accent:#ff6a3d; --road:#1b1d23; } }
  :root[data-theme="dark"] { --bg:#0c0d10; --fg:#f2f2f0; --muted:#8b8f9a; --accent:#ff6a3d; --road:#1b1d23; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; overflow-x:hidden; }
  .stage { position:sticky; top:env(safe-area-inset-top,0px); height:100vh; height:100svh; overflow:hidden; }
  .will { will-change:transform; }
  .letter { display:inline-block; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { createElement: h, useRef, useLayoutEffect } = React;

const STATS = [
  { n: 58, suf: "%", label: "Increase in pick up point use" },
  { n: 23, suf: "%", label: "Decrease in customer phone calls" },
  { n: 27, suf: "%", label: "Increase in pick up point use" },
  { n: 40, suf: "%", label: "Decrease in customer phone calls" },
];
const WORDS = ["WELCOME", "ITZ", "FIZZ"];

function Car() {
  return h("svg", { viewBox: "0 0 420 140", className: "w-[min(70vw,420px)] block", "aria-hidden": true },
    h("path", { d: "M10 100 L20 78 Q24 70 34 68 L96 62 L132 28 Q138 22 148 22 L250 22 Q262 22 270 30 L304 60 L380 70 Q404 74 408 92 L410 104 Z", fill: "var(--accent)" }),
    h("path", { d: "M112 60 L140 34 L190 34 L190 60 Z M202 34 L248 34 L286 60 L202 60 Z", fill: "var(--bg)", opacity: ".85" }),
    h("rect", { x: 10, y: 98, width: 400, height: 10, rx: 4, fill: "var(--fg)", opacity: ".85" }),
    [92, 322].map((cx) =>
      h("g", { key: cx, className: "wheel", style: { transformOrigin: `${cx}px 108px`, transformBox: "view-box" } },
        h("circle", { cx, cy: 108, r: 26, fill: "var(--fg)" }),
        h("circle", { cx, cy: 108, r: 13, fill: "var(--bg)" }),
        h("path", { d: `M${cx - 13} 108 H${cx + 13} M${cx} 95 V121`, stroke: "var(--fg)", strokeWidth: 3 })
      )
    )
  );
}

function Hero() {
  const root = useRef();

  useLayoutEffect(() => {
    gsap.registerPlugin(ScrollTrigger);
    const ctx = gsap.context(() => {
      const q = gsap.utils.selector(root);
      const counters = q(".num");

      // ---- Intro (time-based, runs once) ----
      const intro = gsap.timeline({ defaults: { ease: "power3.out" } });
      intro
        .from(q(".letter"), { yPercent: 110, opacity: 0, duration: 1, stagger: 0.04 })
        .from(q(".stat"), { y: 30, opacity: 0, duration: 0.8, stagger: 0.15 }, "-=0.4")
        .from(".car-wrap", { opacity: 0, duration: 0.8 }, "-=0.8");
      counters.forEach((el) => {
        const o = { v: 0 };
        intro.to(o, { v: +el.dataset.n, duration: 1.4, ease: "power2.out",
          onUpdate: () => (el.textContent = Math.round(o.v)) }, 0.9);
      });

      // ---- Scroll-driven (progress-based, scrubbed with smoothing) ----
      const scroll = gsap.timeline({
        defaults: { ease: "none" },
        scrollTrigger: { trigger: ".track", start: "top top", end: "bottom bottom", scrub: 1.2, invalidateOnRefresh: true },
      });
      scroll
        .fromTo(".car-wrap",
          { x: () => -root.current.querySelector(".car-wrap").offsetWidth * 1.1, scale: 0.9 },
          { x: () => innerWidth, scale: 1.12 }, 0)
        .to(".wheel", { rotation: 1080 }, 0)
        .fromTo(".road-lines", { x: 0 }, { x: () => -innerWidth * 0.8 }, 0)
        .to(".headline", { yPercent: -30, opacity: 0.15, scale: 0.94 }, 0)
        .to(".stats", { yPercent: 25, opacity: 0, scale: 0.96 }, 0.25)
        .to(".bar", { scaleX: 1 }, 0);
    }, root);
    return () => ctx.revert();
  }, []);

  const letters = (w, wi) =>
    h("span", { key: wi, className: "inline-flex mr-[0.9em] last:mr-0 overflow-hidden" },
      [...w].map((c, i) => h("span", { key: i, className: "letter will mr-[0.35em] last:mr-0" }, c)));

  return h("main", { ref: root },
    h("section", { className: "track relative", style: { height: "400vh" } },
      h("div", { className: "stage" },
        h("div", { className: "bar will absolute top-0 left-0 h-[3px] w-full z-20", style: { background: "var(--accent)", transform: "scaleX(0)", transformOrigin: "left" } }),
        h("div", { className: "flex flex-col items-center h-full pt-[12vh] px-4 text-center" },
          h("h1", { className: "headline will font-semibold flex flex-wrap justify-center text-[clamp(1.4rem,5.2vw,4.5rem)] leading-tight" }, WORDS.map(letters)),
          h("div", { className: "stats will mt-10 grid grid-cols-2 md:grid-cols-4 gap-6 md:gap-12 max-w-5xl w-full" },
            STATS.map((s, i) =>
              h("div", { key: i, className: "stat will text-left" },
                h("div", { className: "text-4xl md:text-6xl font-bold tabular-nums", style: { color: "var(--accent)" } },
                  h("span", { className: "num", "data-n": s.n }, 0), s.suf),
                h("p", { className: "mt-2 text-xs md:text-sm", style: { color: "var(--muted)" } }, s.label))))
        ),
        // road + car
        h("div", { className: "absolute inset-x-0 bottom-0 h-[34vh]", style: { background: "var(--road)" } },
          h("div", { className: "road-lines will absolute top-1/2 left-0 flex gap-16", style: { width: "300vw" } },
            Array.from({ length: 60 }, (_, i) => h("span", { key: i, className: "block h-1 w-16 shrink-0 rounded", style: { background: "var(--muted)", opacity: 0.5 } })))),
        h("div", { className: "car-wrap will absolute left-0", style: { bottom: "calc(34vh - 70px)" } }, h(Car))
      )
    ),
    h("section", { className: "min-h-[60vh] flex items-center justify-center text-center px-6", style: { color: "var(--muted)" } },
      h("p", { className: "max-w-md" }, "End of hero. Scroll back up to see the animation reverse – it is bound to scroll progress, not time."))
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(Hero));
</script>
</body>
</html>
